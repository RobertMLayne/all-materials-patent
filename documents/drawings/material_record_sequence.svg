<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500"><rect width="640" height="500" fill="white"/><g font-family="Arial" fill="#17212b"><text x="28" y="28" font-size="18" font-weight="bold">Figure 2. Candidate-material record sequence</text><rect x="45" y="53" width="550" height="57" rx="5" fill="#f0f5f7" stroke="#507185"/><text x="60" y="75" font-size="14" font-weight="bold">1  Numerical candidate</text><text x="60" y="96" font-size="12">Support, basis, exact fractions, interval constraints</text><line x1="320" y1="112" x2="320" y2="125" stroke="#507185" stroke-width="2"/><polygon points="315,122 325,122 320,129" fill="#507185"/><rect x="45" y="131" width="550" height="57" rx="5" fill="#f0f5f7" stroke="#507185"/><text x="60" y="153" font-size="14" font-weight="bold">2  Identity and structure</text><text x="60" y="174" font-size="12">Isotopes, phases, bonding, morphology, spatial scope</text><line x1="320" y1="190" x2="320" y2="203" stroke="#507185" stroke-width="2"/><polygon points="315,200 325,200 320,207" fill="#507185"/><rect x="45" y="209" width="550" height="57" rx="5" fill="#f0f5f7" stroke="#507185"/><text x="60" y="231" font-size="14" font-weight="bold">3  Preparation record</text><text x="60" y="252" font-size="12">Materials, operations, conditions, unresolved dependencies</text><line x1="320" y1="268" x2="320" y2="281" stroke="#507185" stroke-width="2"/><polygon points="315,278 325,278 320,285" fill="#507185"/><rect x="45" y="287" width="550" height="57" rx="5" fill="#f0f5f7" stroke="#507185"/><text x="60" y="309" font-size="14" font-weight="bold">4  Confirmation</text><text x="60" y="330" font-size="12">Composition, structure, calibration, uncertainty, limits</text><line x1="320" y1="346" x2="320" y2="359" stroke="#507185" stroke-width="2"/><polygon points="315,356 325,356 320,363" fill="#507185"/><rect x="45" y="365" width="550" height="57" rx="5" fill="#f0f5f7" stroke="#507185"/><text x="60" y="387" font-size="14" font-weight="bold">5  Conditional property scenario</text><text x="60" y="408" font-size="12">Baseline, change, mechanism, alternative, discriminating test</text><text x="45" y="461" font-size="12">At every step: preserve evidence status and leave missing information unresolved.</text><text x="45" y="482" font-size="12">A completed numerical record is not proof of an available physical material.</text></g></svg>