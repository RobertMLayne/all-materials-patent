version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      official-actions:
        # CodeQL subactions must be updated together to keep init/analyze compatible.
        patterns: ['actions/*', 'github/codeql-action', 'github/codeql-action/*']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
