[tool.ruff]
required-version = "==0.16.8"
target-version = "py312"
line-length = 100
extend-exclude = ["generated_reports"]

[tool.ruff.lint]
# Correctness rules catch undefined names, unused imports and invalid constructs.
# Cosmetic rewrites of preserved scientific artifacts require a separate review.
select = ["E4", "E7", "E9", "F"]
